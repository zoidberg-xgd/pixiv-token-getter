{
  "kind": "node-library",
  "versioning": {
    "mode": "release-please"
  },
  "build": {
    "test": "npm install --no-audit --no-fund && node cli.js --version && node cli.js --help >/dev/null",
    "command": "npm install --no-audit --no-fund"
  },
  "assets": {
    "required": [],
    "optional": []
  },
  "registries": {
    "github": {
      "required": true
    },
    "npm": {
      "required": true,
      "publish": "npm publish --provenance --access public",
      "verify": "npm view pixiv-token-getter@$RELEASE_VERSION version | grep -Fx $RELEASE_VERSION"
    }
  },
  "retention": {
    "stable": 1,
    "prerelease": 1,
    "failed_draft": 2
  },
  "checksums": false,
  "sbom": false
}
